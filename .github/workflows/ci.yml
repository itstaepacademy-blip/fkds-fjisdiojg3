name: Quality Gate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить Ruff и Pytest
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Проверка форматирования (Ruff Format)
        run: ruff format --check .

      - name: Проверка линтером (Ruff Check)
        run: ruff check .

      - name: Запуск тестов (Pytest)
        run: pytest
